<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="NVMeter">
  <title>NVMeter wordmark</title>
  <!--
    Mark on the left + "NVMeter" text on the right.
    Text uses system-ui / SF Pro as a stack; for production export to
    .png/.pdf the text must be converted to outlined paths so the
    wordmark renders identically on machines without SF Pro.
  -->
  <g transform="translate(8 8)">
    <g fill="none" stroke="#2BB1B8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 14 6 H 50 Q 58 6 58 14 V 26 L 53 26 V 32 L 58 32 V 50 Q 58 58 50 58 H 14 Q 6 58 6 50 V 14 Q 6 6 14 6 Z" stroke-width="3"/>
      <path d="M 18 42 L 18 22 L 32 32 L 46 22 L 46 42" stroke-width="5"/>
    </g>
  </g>
  <text x="88" y="54"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif"
        font-size="40" font-weight="600" letter-spacing="-0.5" fill="#1A2A2E">NVMeter</text>
</svg>
