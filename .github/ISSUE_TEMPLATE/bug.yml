name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report only the affected device. Leave out serial numbers, volume names, UUIDs, and unrelated devices. Summarize what happened instead of pasting full System Information, ioreg, or smartctl output.
  - type: input
    id: mac
    attributes: { label: Mac model + macOS version, placeholder: "Mac Studio M2 Ultra, macOS 14.5" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: NVMeter version / commit SHA }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Short error summary for the affected device (optional)
      description: "Summarize the symptom or share only the relevant redacted error line. Do not paste a full log."
