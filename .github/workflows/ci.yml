name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Resolve dependencies
        run: swift package resolve
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Reminder
        run: echo "CLA Assistant bot will comment on this PR; once signed the cla/signed check turns green."
